name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by pages.yml to gate the demo deploy

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs the test suite under c8; fails if coverage drops below the
      # thresholds in the "coverage" script in package.json.
      - run: npm run coverage
